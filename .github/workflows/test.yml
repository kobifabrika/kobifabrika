# test.ps1 ile aynı testler, Ubuntu'da: backend (xUnit + Testcontainers), frontend lint/birim/build, E2E (Playwright).
# Dakika tasarrufu: aynı dalda yeni push gelince eski test koşusu iptal (dağıtım değil); sadece dokümanı değişen commit'te çalışmaz; NuGet, npm ve
# Playwright tarayıcıları cache'lenir.
name: Testler

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  # Sadece bu iş süresince yaşayan, dışarıya kapalı CI konteynerinin şifresi (gizli bilgi değil).
  E2E_CONNECTION_STRING: Server=localhost,1433;Database=KobiFabrika_E2E;User Id=sa;Password=Ci_Gecici_Sifre_2026!;TrustServerCertificate=True

jobs:
  test:
    runs-on: ubuntu-latest
    # Aynı dalda yeni push gelince eski test koşusu iptal (dağıtım işi iptal edilmez, aşağıda kendi kuyruğu var).
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    timeout-minutes: 75
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Ci_Gecici_Sifre_2026!
          TZ: UTC
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci_Gecici_Sifre_2026!' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 30s
      mailpit:
        image: axllent/mailpit:v1.31
        ports: ["1025:1025", "8025:8025"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: dotnet-ef
        run: dotnet tool install --global dotnet-ef --version "10.*"

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Playwright sürümü
        id: pw
        working-directory: frontend
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Playwright tarayıcı cache
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Tarayıcıların sistem paketleri (.deb) de cache'lenir: 2026-10-22'den beri runner imajında çoğu eksik (~120 MB) ve
      # azure aynası çok yavaş (#54'te 47 dk, iş 60 dk sınırında iptal). Cache kurulumdan hemen sonra kaydedilir (iş kırmızı bitse de).
      - name: apt paket cache
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: apt-pw-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}
          restore-keys: |
            apt-pw-

      - name: Playwright tarayıcıları
        id: pw-install
        working-directory: frontend
        # Cache doluyken 1 dk'nın altında; yavaş ayna bütün iş süresini yemesin, erken ve açık nedenle düşsün.
        timeout-minutes: 15
        run: |
          sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-debs > /dev/null
          mkdir -p ~/apt-debs
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2> /dev/null || true
          echo "cache'ten gelen paket: $(ls ~/apt-debs | wc -l)"
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium webkit
          else
            npx playwright install --with-deps chromium webkit
          fi
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2> /dev/null || true
          echo "cache'e yazılacak paket: $(ls ~/apt-debs | wc -l)"

      - name: apt paket cache kaydı
        if: steps.pw-install.outcome == 'success' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: apt-pw-${{ steps.pw.outputs.image }}-${{ steps.pw.outputs.version }}

      # Bir bölüm kalsa da sonrakiler çalışır (test.ps1 gibi); iş sonunda kırmızı olur.
      - name: Backend testleri
        id: backend
        run: dotnet test backend -c Release --results-directory TestResults/ci --report-xunit-ctrf --report-xunit-ctrf-filename backend.json

      - name: Frontend lint
        if: success() || failure()
        working-directory: frontend
        run: npm run lint

      - name: Frontend birim testleri
        if: success() || failure()
        working-directory: frontend
        run: npm run test

      # İki E2E çifti (SMS kapalı: 5180/3100, SMS açık @sms: 5181/3101); API adresi derlemeye gömülü olduğu için iki derleme.
      # Üçüncüsü API'siz sadece-site derlemesi (@sadece-site: 3102; API adresi boş port).
      - name: Frontend build (E2E için)
        id: build
        if: success() || failure()
        working-directory: frontend
        run: |
          NEXT_DIST_DIR=.next-e2e NEXT_PUBLIC_API_URL=http://localhost:5180 npx next build
          NEXT_DIST_DIR=.next-e2e-sms NEXT_PUBLIC_API_URL=http://localhost:5181 npx next build
          NEXT_DIST_DIR=.next-e2e-site NEXT_PUBLIC_SITE_ONLY=1 NEXT_PUBLIC_API_URL=http://localhost:5182 npx next build

      - name: E2E (Playwright)
        if: (success() || failure()) && steps.build.outcome == 'success'
        working-directory: frontend
        env:
          E2E_SKIP_WEB_BUILD: "1"
          E2E_SKIP_API_BUILD: ${{ steps.backend.outcome == 'success' && '1' || '0' }}
        run: npx playwright test

      - name: Özet
        if: always()
        working-directory: frontend
        run: |
          {
            echo "| Bölüm | Geçen | Kalan |"
            echo "|---|---:|---:|"
            for pair in "Backend testleri:ctrf:../TestResults/ci/backend.json" "E2E (Playwright):playwright:test-results/results.json"; do
              IFS=: read -r name kind file <<< "$pair"
              if [ -f "$file" ]; then
                node e2e/scripts/ozet.mjs "$kind" "$file" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log(`| '"$name"' | ${r.passed} | ${r.failed} |`);for(const f of r.failures)console.log(`| ↳ ${f.name} | | ${f.reason.replace(/\|/g,"/")} |`)})'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Playwright raporu
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-raporu
          path: frontend/playwright-report
          retention-days: 14

  # Canlıya dağıtım (docs/canli-ortam.md → Dağıtım): main'e push ve testler yeşilse. İmajlar burada derlenir, registry olmadan
  # SSH ile aktarılır (docker save | zstd | ssh → docker load). Sunucuda sadece bin/actions-girisi.sh'nin üç komutu çalışır.
  # Secret: DEPLOY_SSH_KEY (yoksa iş atlanır). Sunucu anahtarı deploy/canli/known_hosts'ta.
  deploy:
    name: Dağıtım
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Dağıtımlar sırayla ve yarıda kesilmeden (migration ortasında iptal olmasın).
    concurrency:
      group: dagitim
      cancel-in-progress: false
    env:
      HEDEF: deploy@70.40.139.67
    steps:
      - name: Dağıtım anahtarı
        id: anahtar
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_SSH_KEY secret'ı yok: dağıtım atlandı (docs/canli-ortam.md → Dağıtım)." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "var=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "var=1" >> "$GITHUB_OUTPUT"
          echo "etiket=$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.anahtar.outputs.var == '1'

      - uses: docker/setup-buildx-action@v3
        if: steps.anahtar.outputs.var == '1'

      - name: API imajı
        if: steps.anahtar.outputs.var == '1'
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: kobifabrika-api:${{ steps.anahtar.outputs.etiket }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # İki web imajı: site (NEXT_PUBLIC_SITE_ONLY=1) ve tam (site + panel). Sunucuda bin/yayin-modu.sh ile seçilir.
      - name: Web imajı (sadece site)
        if: steps.anahtar.outputs.var == '1'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          build-args: NEXT_PUBLIC_SITE_ONLY=1
          tags: kobifabrika-web-site:${{ steps.anahtar.outputs.etiket }}
          cache-from: type=gha,scope=web-site
          cache-to: type=gha,scope=web-site,mode=max

      - name: Web imajı (tam)
        if: steps.anahtar.outputs.var == '1'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          build-args: NEXT_PUBLIC_SITE_ONLY=0
          tags: kobifabrika-web-tam:${{ steps.anahtar.outputs.etiket }}
          cache-from: type=gha,scope=web-tam
          cache-to: type=gha,scope=web-tam,mode=max

      - name: Sunucuya aktar
        if: steps.anahtar.outputs.var == '1'
        env:
          ETIKET: ${{ steps.anahtar.outputs.etiket }}
        run: |
          cp deploy/canli/known_hosts ~/.ssh/known_hosts
          tar -czf - -C deploy/canli compose.yml Caddyfile bin systemd | ssh "$HEDEF" dosyalar
          docker save "kobifabrika-api:$ETIKET" "kobifabrika-web-site:$ETIKET" "kobifabrika-web-tam:$ETIKET" \
            | zstd -T0 -3 | ssh "$HEDEF" yukle

      - name: Dağıt (yedek → migration → yeni imajlar → /health; hata olursa önceki imaj)
        if: steps.anahtar.outputs.var == '1'
        env:
          ETIKET: ${{ steps.anahtar.outputs.etiket }}
        run: |
          ssh "$HEDEF" dagit "$ETIKET"
          echo "Dağıtıldı: \`$ETIKET\` → https://kobifabrika.com, https://api.kobifabrika.com/health" >> "$GITHUB_STEP_SUMMARY"

      - name: Anahtarı sil
        if: always()
        run: rm -f ~/.ssh/id_ed25519
